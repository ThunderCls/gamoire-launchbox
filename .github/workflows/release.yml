# Builds the plugin zip when a version tag (v1.2.3) is pushed to this repository, then attaches it to a GitHub Release.
# The mirror pushes the tag when a version bump (scripts/Set-Version.ps1) reaches main; the tag must match the csproj
# version (nobody commits here: the repo is a one-way mirror).
#
# A failure after the release is created deletes that release and its tag, so fix and re-run the mirror pipeline (or
# merge the fix); a failure before that (check, build, test, pack) leaves the tag, so delete it on GitHub first.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the repository
        env:
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/Set-Version.ps1 -Check $env:REF_NAME

      - name: Verify the SDK reference
        run: ./scripts/Verify-Lib.ps1

      - name: Build
        run: dotnet build Gamoire.LaunchBox.sln -c Release

      - name: Test
        run: dotnet test Gamoire.LaunchBox.sln -c Release --no-build

      - name: Pack zip
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $zip = ./scripts/Pack.ps1 -Version $env:REF_NAME.TrimStart('v')
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Attest the zip
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.ZIP }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        # A re-run on a tag that already has a release (published or draft) stops before touching it; the release is a
        # draft until the zip is attached, so the cleanup below only ever removes this run's own release.
        run: |
          gh release view $env:REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:REF_NAME already exists" }
          gh release create $env:REF_NAME --draft --title "Gamoire for LaunchBox $env:REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          try {
            gh release upload $env:REF_NAME $env:ZIP
            if ($LASTEXITCODE -ne 0) { throw 'uploading the zip failed' }
            gh release edit $env:REF_NAME --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'publishing the release failed' }
          } catch {
            # Removing the tag too lets the mirror push it again after a fix.
            gh release delete $env:REF_NAME --cleanup-tag --yes
            throw
          }
